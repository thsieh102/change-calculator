<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Change Calculator</h1>
    </header>
    <form id="change-form" novalidate>
      <div class="fields">
        <label>Sale total
          <span class="money"><span aria-hidden="true">$</span><input id="amount-due" inputmode="decimal" placeholder="0.00" required></span>
        </label>
        <label>Amount received
          <span class="money"><span aria-hidden="true">$</span><input id="amount-received" inputmode="decimal" placeholder="0.00" required></span>
        </label>
      </div>
      <button id="calculate-change" type="submit">Calculate Change</button>
      <p id="error" role="alert" hidden></p>
    </form>
    <section aria-labelledby="change-heading" aria-live="polite" aria-atomic="true">
      <h2 id="change-heading">Change due <span id="change-total">$0.00</span></h2>
      <div class="denominations">
        <div><span>Dollars</span><p id="dollars-output">0</p></div>
        <div><span>Quarters</span><p id="quarters-output">0</p></div>
        <div><span>Dimes</span><p id="dimes-output">0</p></div>
        <div><span>Nickels</span><p id="nickels-output">0</p></div>
        <div><span>Pennies</span><p id="pennies-output">0</p></div>
      </div>
    </section>
  </main>
</body>
</html>
